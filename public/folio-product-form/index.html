<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · Product studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7fb;color:#242139;font:16px Inter,Arial,sans-serif}header{height:70px;background:#211e35;color:white;display:flex;align-items:center;padding:0 max(5vw,20px);gap:15px}.logo{display:grid;place-items:center;background:#ae96ff;border-radius:10px;width:37px;height:37px;color:#261e49}.brand{font-size:24px;font-weight:720;letter-spacing:-1px}.divide{border-left:1px solid #575369;padding-left:17px;color:#d4cfe3;font-size:15px}.avatar{margin-left:auto;background:#413958;color:#e5dcff;padding:10px;border-radius:50%;font-size:14px}main{max-width:1260px;margin:auto;padding:30px 4vw 70px}nav{font-size:14px;color:#787385;margin-bottom:24px}button{cursor:pointer;font:inherit}nav button{border:0;background:none;color:#65539a;padding:0}.hero{position:relative;overflow:hidden;background:#ede8fd;border:1px solid #dfd6f4;border-radius:16px;padding:30px 34px;margin-bottom:24px}.art{position:absolute;right:30px;top:-9px;width:145px;height:145px;transform:rotate(-9deg);color:#9676cd}.hero h1{margin:0 0 9px;font-size:clamp(30px,4vw,42px);letter-spacing:-1.8px}.hero p{margin:0;color:#605671}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}.card{background:white;border:1px solid #e1dfe8;border-radius:14px;padding:23px 25px;margin-bottom:20px}.heading{display:flex;gap:12px;align-items:center;margin-bottom:22px}.icon{border-radius:9px;color:#7853bf;background:#f0eafa;padding:9px;display:grid;place-items:center}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}h2{margin:0;font-size:19px;letter-spacing:-.5px}label{display:block;font-size:14px;font-weight:600;margin:16px 0 7px}.star{color:#855db5}input,textarea,select{width:100%;border:1px solid #dcd9e4;border-radius:7px;padding:11px 12px;color:#383348;background:white;font:15px Inter,Arial,sans-serif}textarea{resize:vertical;min-height:84px}::placeholder{color:#918c9d}input:focus,select:focus,textarea:focus{outline:2px solid #9272d3}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.row label{margin-top:12px}.drop{width:100%;display:grid;justify-items:center;gap:10px;padding:22px 8px;border:1.5px dashed #baaad4;border-radius:9px;background:#faf8ff;color:#453952;font-size:14px}.drop svg{width:35px;height:35px;color:#8c69bd}.drop strong{color:#744dac}.muted,small{color:#767180;font-size:13px}.primary,.secondary{border-radius:8px;padding:11px 16px;font-size:15px;font-weight:600}.primary{background:#7550b2;color:white;border:1px solid #7550b2}.secondary{background:white;border:1px solid #d6d0e0;color:#494152}.actions{display:flex;justify-content:flex-end;gap:10px}.thumb{width:100%;max-height:160px;object-fit:contain}.entry{padding:15px 0;border-bottom:1px solid #e6e2ed;display:flex;justify-content:space-between;gap:15px;align-items:center}.mx{display:flex;align-items:center;justify-content:space-between}#msg{color:#674399}.card .heading+label{margin-top:0}@media(max-width:750px){.grid{display:block}.art{width:80px;right:6px;opacity:.45}.hero{padding:24px 15px}.hero p{max-width:80%}.card{padding:18px}.row{gap:9px}}
</style><header><span class="logo" data-i="box"></span><b class="brand">Folio</b><span class="divide">Commerce workspace</span><b class="avatar">FS</b></header><main><nav><button id="catalog">Product catalog</button>　/　<span id="crumb">Add product</span></nav><section class="hero"><svg class="art" viewBox="0 0 140 140" aria-hidden="true"><g fill="#decef7" stroke-width="2"><path d="m22 44 41-19 42 21-42 21z"/><path d="m22 44 41 23v45L22 87z" fill="#d2bbed"/><path d="m63 67 42-21v44l-42 22z" fill="#e8dcfa"/><path d="m36 37 42 22 12-6-42-22z" fill="#f5efff"/><path d="m78 59 12-6v16l-12 6z" fill="#f5efff"/></g><path d="m111 26 3-7 3 7 7 3-7 3-3 7-3-7-7-3zM13 100v9m-4-5h9"/></svg><h1 id="title">Add product</h1><p id="sub">Enter product details to add an item to your catalog.</p></section><form id="form"><div class="grid"><div><section class="card"><div class="heading"><span class="icon" data-i="box"></span><h2>Product details</h2></div><label for="name">Product name <span class="star">*</span></label><input id="name" name="name" placeholder="e.g. Everyday canvas tote" required maxlength="150"><label for="desc">Description</label><textarea id="desc" name="description" placeholder="Describe your product, materials, and key features…"></textarea><div class="row"><div><label for="category">Category <span class="star">*</span></label><select required name="category" id="category"><option value="">Select category</option><option>Apparel</option><option>Accessories</option><option>Electronics</option><option>Home & living</option><option>Beauty</option><option>Other</option></select></div><div><label for="brand">Brand</label><input name="brand" id="brand" placeholder="Enter brand name"></div></div></section><section class="card"><div class="heading"><span class="icon" data-i="tag"></span><h2>Pricing & inventory</h2></div><div class="row"><div><label for="price">Price (LKR) <span class="star">*</span></label><input required type="number" step=".01" min="0" name="price" id="price" placeholder="0.00"></div><div><label for="stock">Stock quantity</label><input type="number" min="0" name="stock" id="stock" placeholder="0"></div></div><label for="sku">SKU</label><input name="sku" id="sku" placeholder="e.g. TOTE-001"></section></div><div><section class="card"><div class="heading"><span class="icon" data-i="image"></span><h2>Product image</h2></div><button type="button" class="drop" id="upload"><span data-i="upload"></span><span><strong>Click to upload</strong> or drag and drop</span><small>PNG, JPG or WebP up to 2 MB</small></button><input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden><div id="preview"></div></section><section class="card"><div class="heading"><span class="icon" data-i="layers"></span><h2>Product status</h2></div><label for="status">Status</label><select name="status" id="status"><option>Draft</option><option>Active</option><option>Archived</option></select><p class="muted" id="hint">Keep this product as a draft while you work.</p></section><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save product</button></div></div></div></form><section class="card" id="list" hidden></section><p id="msg" role="status"></p></main><script src="app.js"></script></html>
